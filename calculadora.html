<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Horário de Saída</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            max-width: 420px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #4a5568;
            font-size: 1.4rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
        }

        select, input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        .carga-info {
            background: #e6fffa;
            color: #234e52;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .resultado {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-top: 25px;
        }

        .resultado-label {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .horario-saida {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .intervalo-info {
            margin-top: 12px;
            font-size: 0.9rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕐 Calculadora de Horário de Saída</h1>

        <div class="input-group">
            <label for="carga">📋 Selecione sua Carga Horária</label>
            <select id="carga" onchange="atualizarCarga()">
                <option value="525">8 horas e 45 minutos</option>
                <option value="1154">19 horas e 14 minutos</option>
            </select>
        </div>

        <div class="carga-info" id="cargaExibida">
            ✅ Carga selecionada: <strong>8h 45min</strong>
        </div>

        <div class="input-group">
            <label for="entrada">🕒 Horário de Entrada</label>
            <input type="time" id="entrada" required>
        </div>

        <div class="input-group">
            <label for="intervalo">🍽️ Tempo de Intervalo (minutos)</label>
            <input type="number" id="intervalo" value="60" min="0" max="240" placeholder="60">
        </div>

        <button class="btn" onclick="calcular()">📅 Calcular Horário de Saída</button>

        <div class="resultado" id="resultado" style="display: none;">
            <div class="resultado-label">Você deve sair às:</div>
            <div class="horario-saida" id="saida"></div>
            <div class="intervalo-info" id="detalhes"></div>
        </div>
    </div>

    <script>
        const cargas = {
            "525": { minutos: 525, texto: "8h 45min" },
            "1154": { minutos: 1154, texto: "19h 14min" }
        };

        function atualizarCarga() {
            const select = document.getElementById('carga');
            const carga = cargas[select.value];
            document.getElementById('cargaExibida').innerHTML = 
                `✅ Carga selecionada: <strong>${carga.texto}</strong>`;
            calcular();
        }

        function calcular() {
            const entrada = document.getElementById('entrada').value;
            const intervalo = parseInt(document.getElementById('intervalo').value) || 0;
            const cargaSelecionada = document.getElementById('carga').value;
            const carga = cargas[cargaSelecionada];

            if (!entrada) {
                alert('Por favor, informe seu horário de entrada!');
                return;
            }

            const [hEntrada, mEntrada] = entrada.split(':').map(Number);
            const minutosEntrada = hEntrada * 60 + mEntrada;

            const minutosSaida = minutosEntrada + carga.minutos + intervalo;

            const hSaida = Math.floor(minutosSaida / 60) % 24;
            const mSaida = minutosSaida % 60;

            const horarioSaida = `${String(hSaida).padStart(2, '0')}:${String(mSaida).padStart(2, '0')}`;

            document.getElementById('saida').textContent = horarioSaida;
            document.getElementById('detalhes').textContent = 
                `Entrada: ${entrada} | Carga: ${carga.texto} | Intervalo: ${intervalo}min`;
            document.getElementById('resultado').style.display = 'block';
        }

        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('change', calcular);
            el.addEventListener('keypress', e => {
                if (e.key === 'Enter') calcular();
            });
        });
    </script>
</body>
</html>
